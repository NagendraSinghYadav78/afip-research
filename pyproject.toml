[project]
name = "afip-research"
version = "0.1.0"
description = "Reproducible-research companion code for the AFIP / Constitutional-AI-financial-decision-making manuscript"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
vertex = ["anthropic[vertex]>=0.30"]
groq = ["groq>=1.0"]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
